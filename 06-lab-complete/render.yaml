# Render Blueprint (https://render.com/docs/blueprint-spec)
# Render đọc render.yaml ở gốc repo; file này nằm trong 06-lab-complete/ nên khi tạo
# Blueprint chọn "Blueprint Path" = 06-lab-complete/render.yaml.
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        sync: false              # nhập tay trên dashboard, không commit giá trị
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []              # chỉ cho service trong cùng tài khoản kết nối
