# Exercise 7.3 — Quality gate: chạy eval trên golden dataset cho mỗi PR.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có regression so với
# baseline → step fail → job fail → branch protection ("Require status checks") chặn merge.
name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        # Tắt lỗi giả lập để gate không fail ngẫu nhiên vì lỗi upstream 1%
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          cat agent.log; exit 1

      - name: Eval + quality gate (accuracy >= 85%, no regression vs committed baseline)
        run: |
          python eval/run_eval.py --url http://localhost:8000 \
            --min-accuracy 0.85 \
            --baseline reports/eval_v2.json \
            --out eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log
